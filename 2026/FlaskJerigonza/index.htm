<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jerigonza Translator</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 300px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #output { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Jerigonza API Interface</h2>
    <input type="text" id="userInput" placeholder="Enter text here...">
    <button onclick="translateText()">Translate</button>
    <div id="output"></div>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('userInput').value;
        const outputDiv = document.getElementById('output');

        if (!text) return;

        try {
            const response = await fetch('http://127.0.0.1:5000/jerigonza', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();
            outputDiv.innerText = "Result: " + data.result;
        } catch (error) {
            outputDiv.innerText = "Error: Could not connect to API.";
            console.error(error);
        }
    }
</script>

</body>
</html>
